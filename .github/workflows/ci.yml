name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application and font source packaging
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify owner-accepted release bytes
        run: node scripts/verify-accepted-release.mjs dist
